name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Node ${{ matrix.node }} / Pi ${{ matrix.pi }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24.x']
        pi: ['0.99.0', '1.3.0', '1.4.0']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The opt-in harness runs npm ci and installs the exact Pi/TUI pair in a
      # disposable copy, then runs npm test with PI_OPENCODE_SDK set. No skip.
      - name: Clean install and full suite, including SDK sessions
        run: npm run test:pi-versions
        env:
          PI_OPENCODE_TEST_VERSION: ${{ matrix.pi }}
      - name: Inspect package contents without publishing
        run: npm pack --dry-run --json
