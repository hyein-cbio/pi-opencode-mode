name: Latest upstream CodeMode

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

# Checks only: no repository writes, auto-merge, release or npm publication.
permissions:
  contents: read

jobs:
  compatibility:
    name: Latest CodeMode compatibility on Modal
    # Check the PR author, not the merger or triggering actor.
    # Fork pull_request events do not receive secrets, even after merging.
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.event.pull_request.user.login == 'cursor[bot]' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # PR runs test the merged revision; manual runs test the selected ref.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ci/requirements.txt
      - name: Install Modal SDK
        run: python -m pip install -r ci/requirements.txt
      # One app resolves npm latest once, then tests that exact version in all
      # six isolated cells. No fallback to release pins on lookup failure.
      - name: Resolve and test latest upstream on Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [[ -z "$MODAL_TOKEN_ID" || -z "$MODAL_TOKEN_SECRET" ]]; then
            echo "::error::Set MODAL_TOKEN_ID and MODAL_TOKEN_SECRET as repository or organization Actions secrets."
            exit 1
          fi
          modal run ci/modal_ci.py::matrix --upstream
